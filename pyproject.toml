[project]
name = "portfolio"
version = "0.1.0"
description = "Kory Pritchett's professional portfolio showcasing curriculum development and automation projects"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kory Pritchett", email = "kory.pritchett@email.com"}
]
requires-python = ">=3.11"
dependencies = [
    "jupyter-book>=1.0.0",
    "mystmd>=1.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "jupyterlab>=4.0.0",
    "node>=1.2.3",
    "npm>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
